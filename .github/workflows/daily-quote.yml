name: Daily signature quote

on:
  schedule:
    - cron: "5 12 * * *"      # 12:05 UTC = 5:05 AM PDT / 4:05 AM PST
  workflow_dispatch:           # "Run workflow" button for manual refreshes
  push:
    branches: [main]
    paths: ["quotes.txt", "render.py"]

permissions:
  contents: write

concurrency:
  group: daily-quote
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Render today's quote
        run: python render.py

      - name: Commit if the image changed
        run: |
          git config user.name  "vestra-quote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote.png
          if git diff --cached --quiet; then
            echo "Quote unchanged."
          else
            git commit -m "Daily quote $(TZ=America/Los_Angeles date +%F)"
            git push
          fi
